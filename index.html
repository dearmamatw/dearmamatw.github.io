<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>媽媽，你睡了嗎？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efb64e;
    --panel: #fdf6ef;
    --ink: #1a2547;
    --ink-soft: rgba(26, 37, 71, .72);
    --accent: #1a2547;
    --logo-orange: #ee9a5c;
    --hairline: rgba(26, 37, 71, .18);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-weight: 400; line-height: 1.8; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 100px; }

  .topbar { padding: 30px 0 8px; }
  .logo { display: inline-flex; align-items: center; }
  .logo img { width: clamp(180px, 22vw, 280px); height: auto; display: block; }

  .hero { text-align: center; padding: 22px 0 34px; }
  .hero h1 {
    font-weight: 900; font-size: clamp(2rem, 5.6vw, 3rem); color: var(--ink);
    margin: 0 0 20px; letter-spacing: .02em;
  }
  .hero p.subtitle { font-weight: 500; max-width: 34em; margin: 0 auto; color: var(--ink); font-size: 1.02rem; line-height: 1.65; }

  .rule-full { display: none; }

  .nav-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
  }
  .part {
    padding: 40px 22px 46px; text-align: center; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    background: var(--panel); border-radius: 26px; border: 2px solid transparent;
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .part:hover, .part.active { border-color: var(--accent); }
  .part:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(26, 37, 71, .12); }
  .part .photo {
    width: 70%; aspect-ratio: 1 / 1; overflow: hidden; background: transparent; border-radius: 16px;
  }
  .part .photo img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; }
  .part .label {
    font-weight: 700; font-size: 1.14rem; color: var(--ink); position: relative; padding-bottom: 6px;
  }
  .part .label::after {
    content: ""; position: absolute; left: 50%; bottom: 0; height: 1.5px; width: 0;
    background: var(--accent); transition: width .22s ease, left .22s ease;
  }
  .part:hover .label::after, .part.active .label::after { width: 100%; left: 0; }
  .part:hover .label, .part.active .label { color: var(--accent); }
  

  .submenu {
    max-height: 0; overflow: hidden; transition: max-height .3s ease;
    transition: max-height .3s ease;
  }
  .submenu.open { max-height: 360px; }
  .submenu-inner { padding: 22px 0 6px; }
  .item-grid { display: flex; flex-direction: column; background: var(--panel); border-radius: 22px; padding: 4px 26px; }
  .item-link {
    display: flex; align-items: center; gap: 12px; text-decoration: none;
    padding: 18px 4px; color: var(--ink); font-size: .95rem; font-weight: 400;
    border-top: 1px solid var(--hairline); transition: color .15s ease;
  }
  .item-link:hover { color: var(--accent); }
  .item-link .arrow { margin-left: auto; flex-shrink: 0; color: var(--accent); font-weight: 500; transition: transform .15s ease; }
  .item-link:first-child { border-top: none; }
  .item-link:hover .arrow { transform: translateX(4px); }


  .footer-cta { text-align: center; margin-top: 84px; padding-top: 44px; border-top: 1px solid var(--hairline); }
  .footer-cta p { color: var(--ink-soft); font-weight: 400; font-size: .92rem; margin: 0 0 20px; }
  .fb-link {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    color: var(--ink); font-weight: 700; font-size: .92rem; letter-spacing: .04em;
    padding: 13px 4px; border-bottom: 1.5px solid var(--ink); transition: color .15s ease, border-color .15s ease;
  }
  .fb-link:hover { color: var(--accent); border-color: var(--accent); }
  .fb-link .arrow { transition: transform .15s ease; }
  .fb-link:hover .arrow { transform: translateX(4px); }

  @media (max-width: 700px) {
    .nav-row { grid-template-columns: 1fr; }
    .nav-row { gap: 16px; }
    .part { padding: 30px 20px; }
  }
</style>
<style id="dm-lang">
html body .dm-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
html body .dm-lang{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:#FDF6EF;
  box-shadow:inset 0 0 0 1.5px rgba(26,37,71,.2);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:13px;font-weight:700;line-height:1;letter-spacing:.04em;flex-shrink:0;text-indent:0}
html body .dm-lang a{display:block;padding:7px 12px;border-radius:999px;color:#1A2547;text-decoration:none;border:none;transition:background .15s ease}
html body .dm-lang a:hover{background:rgba(26,37,71,.08)}
html body .dm-lang a[aria-current]{background:#1A2547;color:#fff;cursor:default}
@media print{html body .dm-lang{display:none}}
</style>
<style>.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}</style>

  };
  var PARTS = [
    {
      id: "hello", index: "01", label: "Hello 女孩", photo: "hello",
      items: [
        { text: "生與不生的大哉問", url: "https://dearmamatw.github.io/To-have-child-or-not-to-have-child/" }
      ]
    },
    {
      id: "pregnancy", index: "02", label: "懷孕生產", photo: "pregnancy",
      items: [
        { text: "產前就要先準備好的產後避難計劃", url: "https://dearmamatw.github.io/Postpartum-plan/" },
        { text: "孕期親密關係田野大調查", url: "https://dearmamatw.github.io/Perinatal-intimacy-survey/" }
      ]
    },
    {
      id: "postpartum", index: "03", label: "產後育兒", photo: "postpartum",
      items: [
        { text: "媽媽們準備給爸爸的父親節彩蛋", url: "https://dearmamatw.github.io/Happy_father_day/" }
      ]
    }
  ];

  var navWrap = document.getElementById("navWrap");

  var row = document.createElement("div");
  row.className = "nav-row";
  var panel = document.createElement("div");
  panel.className = "submenu";
  panel.id = "submenu";

  PARTS.forEach(function (part) {
    var tile = document.createElement("div");
    tile.className = "part";
    tile.id = "part-" + part.id;
    tile.innerHTML =
      '<div class="photo"><img src="' + PHOTOS[part.photo] + '" alt="' + part.label + '"></div>' +
      '<div class="label">' + part.label + '</div>';
    row.appendChild(tile);
  });

  navWrap.appendChild(row);
  navWrap.appendChild(panel);

  var mobileMQ = window.matchMedia("(max-width: 700px)");
  mobileMQ.addEventListener && mobileMQ.addEventListener("change", function(){ if (!mobileMQ.matches && navWrap.lastChild !== panel) navWrap.appendChild(panel); });
  var activeId = null;
  var hoverOpenedAt = 0;
  var closeTimer = null;

  function renderPanel(part) {
    var html = '<div class="submenu-inner"><div class="item-grid">';
    part.items.forEach(function (item) {
      html += '<a class="item-link" href="' + item.url + '" target="_blank" rel="noopener noreferrer">' +
        '<span>' + item.text + '</span><span class="arrow">→</span></a>';
    });
    html += '</div></div>';
    panel.innerHTML = html;
  }

  function open(id) {
    var part = PARTS.filter(function (p) { return p.id === id; })[0];
    if (!part) return;
    activeId = id;
    document.querySelectorAll(".part").forEach(function (el) {
      el.classList.toggle("active", el.id === "part-" + id);
    });
    renderPanel(part);
    // 手機版：選單直接放在被點的分類卡片下面；桌機版放在三張卡片下面
    var tileEl = document.getElementById("part-" + id);
    if (mobileMQ.matches) { if (tileEl.nextSibling !== panel) tileEl.after(panel); }
    else if (navWrap.lastChild !== panel) { navWrap.appendChild(panel); }
    panel.classList.add("open");
  }

  function close() {
    activeId = null;
    document.querySelectorAll(".part").forEach(function (el) { el.classList.remove("active"); });
    panel.classList.remove("open");
  }

  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(close, 220);
  }
  function cancelClose() {
    clearTimeout(closeTimer);
  }

  PARTS.forEach(function (part) {
    var tile = document.getElementById("part-" + part.id);
    tile.addEventListener("mouseenter", function () { if (mobileMQ.matches) return; cancelClose(); hoverOpenedAt = Date.now(); open(part.id); });
    tile.addEventListener("mouseleave", function () { if (!mobileMQ.matches) scheduleClose(); });
    tile.addEventListener("click", function () {
      // 手機點一下時會先觸發 mouseenter 再觸發 click，避免剛打開就被關掉
      if (activeId === part.id && Date.now() - hoverOpenedAt > 500) { close(); } else { cancelClose(); open(part.id); }
    });
  });

  panel.addEventListener("mouseenter", cancelClose);
  panel.addEventListener("mouseleave", function () { if (!mobileMQ.matches) scheduleClose(); });
})();
</script>
